['verifyStartupCompilerBudget':false,'verifyStartupCompilerBudgetConflict':true].each { taskName, conflict ->
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'lab.owmcguest.StartupCompilerBudgetCheck'
        def folder = layout.buildDirectory.dir('compiler-budget-fixture').get().asFile
        def directive = new File(folder, 'owned.json')
        doFirst { folder.mkdirs(); directive.setText('[{"match":"*::*","c2":{"Exclude":true}}]\n','UTF-8') }
        jvmArgs '-XX:+UnlockDiagnosticVMOptions', '-XX:CompilerDirectivesFile='+directive.absolutePath
        systemProperty 'owmc.startupCompilerBudget','true'
        systemProperty 'owmc.startupCompilerBudgetFile',directive.absolutePath
        systemProperty 'owmc.compilerTestDirectory',folder.absolutePath
        if(conflict) args 'conflict'
    }
    tasks.named('check') { dependsOn tasks.named(taskName) }
}
